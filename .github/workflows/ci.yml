name: AXALITH OS CI

on:
  push:
    branches: ["main", "dev/**"]
  pull_request:
  workflow_dispatch:

jobs:
  x86_64-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils grub-pc-bin grub-common xorriso qemu-system-x86
      - name: Build bootable ISO
        run: make clean iso
      - name: QEMU boot smoke test
        shell: bash
        run: |
          set +e
          timeout 12s qemu-system-x86_64 \
            -machine q35 -m 512M \
            -cdrom build/axalith-os-0.1-x86_64.iso \
            -boot d -display none -serial stdio -no-reboot -no-shutdown \
            > build/qemu-serial.log 2>&1
          status=$?
          set -e
          cat build/qemu-serial.log
          if ! grep -q "Kernel status: ONLINE" build/qemu-serial.log; then
            echo "Kernel did not reach ONLINE state (qemu exit: $status)"
            exit 1
          fi
      - name: Upload ISO and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axalith-os-0.1-x86_64
          path: |
            build/axalith-os-0.1-x86_64.iso
            build/qemu-serial.log
